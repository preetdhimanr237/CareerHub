{% extends "core/base.html" %}

{% block title %}Edit Company Profile - CareerHub{% endblock %}

{% block content %}

<div class="container">

    <div class="mb-4">
        <h1 class="fw-bold">Edit Company Profile</h1>
        <p class="text-muted">
            Update your company information.
        </p>
    </div>

    <div class="card shadow-sm">

        <div class="card-body p-4">

            <form method="POST" enctype="multipart/form-data">

                {% csrf_token %}

                {{ form.as_p }}

                <div class="mt-3">

                    <button
                        type="submit"
                        class="btn btn-primary"
                    >
                        Save Changes
                    </button>

                    <a
                        href="{% url 'company_profile' %}"
                        class="btn btn-outline-secondary"
                    >
                        Cancel
                    </a>

                </div>

            </form>

        </div>

    </div>

</div>

{% endblock %}
